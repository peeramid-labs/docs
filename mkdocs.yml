site_name: Rankify Docs
site_url: https://rankify.it
repo_url: https://github.com/peeramid-labs
site_description: Rankify Documentation
nav:
    - Welcome:
          - "index.md"
          - "concepts.md"
          - "usecases.md"
    - Architecture:
         - "architecture/overview.md"
         - "architecture/poc.md"
         - "architecture/fellowship.md"
         - "architecture/MAO.md"
         - "architecture/staking.md"
         - "cvpp.md"
         - "acid.md"
    - Developing:
          - "architecture/index.md"
          - "architecture/create.md"
          - "addresses.md"
    # - SDK: "sdk"
    - Contract API:
          - ...
          - "Multipass.md"
    - Support:
          - "support/index.md"
          - "support/faq.md"
theme:
    name: readthedocs
    #   name: mkdocs
    color_mode: dark
    user_color_mode_toggle: true
    hljs_languages:
        - solidity
        - typescript
        - rust
        - bash
plugins:
    - include_dir_to_nav
    - awesome-pages
    - mermaid2:
          version: "9.4.3" # only works with version < 10
          arguments:
            theme: "light"
            # themeVariables:
            #     primaryColor: "#BB2528"
            #     primaryTextColor: "#fff"
            #     primaryBorderColor: "#7C0000"
            #     lineColor: "#F8B229"
            #     secondaryColor: "#20000F"
            #     tertiaryColor: "#fff"
    - search
    - plantuml:
        #   theme: cyborg
          puml_url: https://www.plantuml.com/plantuml/
        #   num_workers: 8
markdown_extensions:
    - admonition
    - mkautodoc
    - pymdownx.details
    - pymdownx.superfences:
        custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
    - attr_list
    - toc:
          permalink: "#"
extra_css:
    - css/custom.css
# nav:
#     - Home: "Welcome/index.md"
